<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Station - Your Musical Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f0f13;
            --card-bg: #181820;
            --accent: #b829dd;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Navigation */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 5%;
            background: rgba(15, 15, 19, 0.95);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #2a2a35;
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: -1px;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 2.5rem;
        }

        nav a {
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 400;
            transition: color 0.3s ease;
            font-size: 0.95rem;
        }

        nav a:hover {
            color: var(--accent);
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 6rem 2rem 4rem;
            background: radial-gradient(circle at top center, #2d1b4e 0%, var(--bg-color) 70%);
        }

        /* Equalizer Animation */
        .equalizer {
            display: flex;
            gap: 6px;
            justify-content: center;
            height: 40px;
            margin-bottom: 1.5rem;
        }

        .bar {
            width: 8px;
            background: var(--accent);
            border-radius: 4px;
            animation: bounce 1.2s infinite ease-in-out;
        }

        .bar:nth-child(1) { animation-delay: 0s; }
        .bar:nth-child(2) { animation-delay: 0.2s; }
        .bar:nth-child(3) { animation-delay: 0.4s; }
        .bar:nth-child(4) { animation-delay: 0.6s; }
        .bar:nth-child(5) { animation-delay: 0.8s; }

        @keyframes bounce {
            0%, 100% { height: 10px; }
            50% { height: 40px; }
        }

        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            font-weight: 700;
            background: linear-gradient(to right, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto;
        }

        /* Featured Playlist Section */
        .featured {
            text-align: center;
            padding: 5rem 5%;
            background-color: var(--card-bg);
            margin: 2rem auto;
            width: 90%;
            max-width: 1200px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #2a2a35;
        }

        .featured h2 {
            font-size: 2.2rem;
            margin-bottom: 2.5rem;
            color: var(--text-primary);
            display: inline-block;
            position: relative;
        }

        .featured h2::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 3px;
            background: var(--accent);
            border-radius: 2px;
        }

        /* Video Container (Responsive 16:9) */
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 aspect ratio */
            height: 0;
            overflow: hidden;
            max-width: 900px;
            margin: 0 auto;
            border-radius: 12px;
            border: 2px solid #333;
            box-shadow: 0 15px 40px rgba(184, 41, 221, 0.2);
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .caption {
            margin-top: 2rem;
            font-style: italic;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 3rem 2rem;
            color: #555;
            font-size: 0.9rem;
            border-top: 1px solid #222;
            margin-top: 4rem;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .hero h1 { font-size: 2.5rem; }
            nav { flex-direction: column; gap: 1rem; }
            nav ul { gap: 1.5rem; }
            .featured { padding: 3rem 1.5rem; }
            .featured h2 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav>
        <div class="logo">VIBE STATION</div>
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#featured">Featured</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <!-- Hero Section -->
    <header id="home" class="hero">
        <div class="equalizer">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
        <h1>Feel the Rhythm</h1>
        <p>Your daily destination for curated beats, relaxing melodies, and the best musical vibes on the web.</p>
    </header>

    <!-- Main Content / Video Player -->
    <main>
        <section id="featured" class="featured">
            <h2>Currently Playing</h2>
            
            <!-- Responsive YouTube Embed -->
            <div class="video-container">
                <iframe 
                    src="https://www.youtube.com/embed/aroZ0SSNoEo?si=IF5puqEgdLkkDhPo" 
                    title="Featured Music Playlist" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                    allowfullscreen>
                </iframe>
            </div>
            
            <p class="caption">Sit back, relax, and enjoy the featured mix. 🎧</p>
        </section>
    </main>

    <!-- Footer -->
    <footer id="contact">
        <p>&copy; 2026 Vibe Station. Designed for music lovers.</p>
    </footer>

</body>
</html>
