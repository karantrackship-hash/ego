<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chill Bizz — Drift Into The Moment</title>
<meta name="description" content="Chill Bizz — a dreamy music lounge with a live sky, clock and ambient player.">
<!-- Link to the external CSS file -->
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="sky"></canvas><div class="vignette"></div>
<div class="app">
  <header class="top"><div class="logo">Chill Bizz <span>/ After Hours</span></div><div class="pill">headphones recommended</div></header>
  <main class="center">
    <div class="kicker">slow down · breathe in · press play</div>
    <h1>Chill Bizz</h1>
    <div class="tag">A little music. A little sky. A lot less noise.</div>
    <div id="clock" class="clock">--:--:--</div>
    <div id="date" class="date">---</div>
    <section id="player" class="player">
      <div class="track">
        <div class="disc">♪</div>
        <div><b id="trackName">Cloud Drift</b><small id="trackMeta">ambient loop · 01</small></div>
      </div>
      <div class="controls">
        <button id="prev" aria-label="Previous track">⏮</button>
        <button id="back" aria-label="Back 10 seconds">↶</button>
        <button id="play" class="primary" aria-label="Play"><span id="playIcon">▶</span></button>
        <button id="forward" aria-label="Forward 10 seconds">↷</button>
        <button id="next" aria-label="Next track">⏭</button>
      </div>
    </section>
  </main>
  <footer class="bottom"><div class="hint">Tip: click anywhere to wake the sound engine.</div><div class="status"><i class="dot"></i> live sky · local time</div></footer>
</div>

<!-- Link to the external JavaScript file -->
<script src="script.js"></script>
</body>
</html>
